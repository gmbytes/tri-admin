[package]
name = "tri-mcp-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client"] }
process-wrap = { version = "=10.0.0", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop", "process-group"] }
tokio = { workspace = true, features = ["process", "io-std"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tri-mcp-test-peer"
path = "tests/fixtures/peer.rs"

[lints]
workspace = true
