[package]
name = "tri-admin-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "tri_admin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
desktop-core = { path = "../../../crates/desktop-core" }
keyring = "4.2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
serde_json = "1"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[profile.dev.package."sha2@0.10.9"]
opt-level = 3
