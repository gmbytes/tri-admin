name: tri-admin-dev
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${TRI_MYSQL_ROOT_PASSWORD:?Generate .env with tools/init-dev-env.mjs}
      MYSQL_DATABASE: tri_admin_dev
    ports:
      - "127.0.0.1:13316:3306"
    volumes:
      - tri_admin_mysql:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/001-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  tri_admin_mysql:
