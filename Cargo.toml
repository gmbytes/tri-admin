[workspace]
members = ["services/admin-api", "crates/desktop-core", "crates/resource-runtime", "crates/resource-generator", "crates/extension-package"]
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime = "0.3"
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
rpassword = "7"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
thiserror = "2"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
http-body-util = "0.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
zeroize = "1"
url = "2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls"] }
aws-sigv4 = "=1.4.5"
aws-credential-types = "=1.2.14"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
csv = "=1.4.0"
calamine = "=0.37.0"
rust_xlsxwriter = { version = "=0.101.0", features = ["constant_memory"] }
zip = { version = "=9.0.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
base64 = "0.22"
subtle = "=2.6.1"
ipnet = "=2.12.2"
rustls-pemfile = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

# Large desktop files use SHA-256 in development too; keep the compression loop optimized.
[profile.dev.package."sha2@0.10.9"]
opt-level = 3
